<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: #ddd; }
  .frame { width: 1080px; height: 1350px; position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(180deg, #fff0cc 0%, #ffd9ea 48%, #dce7ff 100%); }
  .photo { position:absolute; inset:0; background-image:url('../../docs/assets/custom-facial.jpg'); background-size:cover; background-position:center; opacity:.34; filter:saturate(.95) brightness(.98); transform:scale(1.04); }
  .wash { position:absolute; inset:0; background:
    linear-gradient(180deg, rgba(32,21,28,0.08) 0%, rgba(36,24,31,0.20) 36%, rgba(42,28,38,0.68) 100%),
    radial-gradient(circle at 14% 14%, rgba(255,255,255,0.45), transparent 19%),
    radial-gradient(circle at 84% 14%, rgba(255,255,255,0.28), transparent 18%),
    radial-gradient(circle at 45% 100%, rgba(255,255,255,0.12), transparent 34%);
  }
  .egg, .egg2, .egg3, .petal, .petal2 { position:absolute; border-radius:50%; }
  .egg { width:150px; height:210px; left:250px; top:178px; transform:rotate(-16deg); background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.28); box-shadow: inset 0 0 0 8px rgba(255,255,255,.06); }
  .egg2 { width:126px; height:172px; right:92px; top:112px; transform:rotate(17deg); background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.28); }
  .egg3 { width:104px; height:144px; right:176px; top:186px; transform:rotate(-8deg); background:rgba(255,255,255,.11); border:2px solid rgba(255,255,255,.18); }
  .stripe, .stripe2, .stripe3 { position:absolute; height:10px; border-radius:999px; background:#e8d6ff; opacity:.8; }
  .stripe { width:92px; left:278px; top:230px; transform:rotate(-16deg); }
  .stripe2 { width:70px; right:116px; top:166px; transform:rotate(17deg); background:rgba(255,255,255,.78); }
  .stripe3 { width:58px; right:196px; top:230px; transform:rotate(-8deg); }
  .petal { width:240px; height:240px; right:-80px; bottom:230px; background:rgba(255,255,255,.10); }
  .petal2 { width:320px; height:320px; left:-120px; bottom:-96px; background:rgba(255,255,255,.12); }
  .brand-pill { position:absolute; top:68px; left:68px; display:inline-flex; gap:12px; align-items:center; padding:14px 22px; border-radius:999px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.30); backdrop-filter:blur(16px); font-size:24px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
  .brand-pill .dot { width:14px; height:14px; border-radius:50%; background:#e8d6ff; box-shadow:0 0 0 4px rgba(255,255,255,.18); }
  .eyebrow { position:absolute; left:82px; top:186px; font-size:26px; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.92); }
  .headline { position:absolute; left:76px; right:112px; top:250px; font-family: Georgia, 'Iowan Old Style', serif; font-size:104px; line-height:.92; font-weight:700; max-width:8.2ch; text-wrap:balance; }
  .support { position:absolute; left:82px; right:124px; top:718px; font-size:40px; line-height:1.26; color:rgba(255,255,255,.94); max-width:22ch; white-space:pre-line; }
  .footer { position:absolute; left:76px; right:76px; bottom:88px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .cta { display:inline-flex; align-items:center; padding:26px 36px; border-radius:999px; background:rgba(255,255,255,.94); color:#39273b; font-size:31px; font-weight:800; box-shadow:0 18px 44px rgba(0,0,0,.14); max-width:590px; }
  .signature { text-align:right; font-size:26px; line-height:1.34; color:rgba(255,255,255,.86); }
  .signature strong { display:block; font-size:30px; color:#fff; }
</style>
</head>
<body>
  <div class="frame">
    <div class="photo"></div>
    <div class="wash"></div>
    <div class="egg"></div><div class="egg2"></div><div class="egg3"></div>
    <div class="stripe"></div><div class="stripe2"></div><div class="stripe3"></div>
    <div class="petal"></div><div class="petal2"></div>
    <div class="brand-pill"><span class="dot"></span>Seasonal</div>
    <div class="eyebrow">Fresh Start</div>
    <div class="headline">Soft skin.<br>Fresh energy.</div>
    <div class="support">Step into spring feeling confident, refreshed, and radiant.
Have a happy Easter.</div>
    <div class="footer">
      <div class="cta">Step into spring glowing</div>
      <div class="signature"><strong>NCS Aesthetics</strong>Fresno, California</div>
    </div>
  </div>
</body>
</html>
