<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: #ddd; }
  .frame {
    width: 1080px; height: 1350px; position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(180deg, #fcf4ef 0%, #ecd6d4 48%, #e0b7bf 100%);
  }
  .photo { position: absolute; inset: 0; background-image: url('../../docs/assets/brand-cover.jpg'); background-size: cover; background-position: center; filter: saturate(0.92) contrast(1.02) brightness(0.95); opacity: 0.5; transform: scale(1.04); }
  .wash { position: absolute; inset: 0; background:
      linear-gradient(180deg, rgba(24,16,14,0.14) 0%, rgba(24,16,14,0.26) 38%, rgba(24,16,14,0.66) 100%),
      radial-gradient(circle at 16% 16%, rgba(255,255,255,0.30), transparent 20%),
      radial-gradient(circle at 82% 12%, rgba(255,255,255,0.18), transparent 18%);
  }
  .egg, .petal { position:absolute; border-radius: 50%; filter: blur(0.4px); }
  .egg { width: 150px; height: 210px; background: rgba(255,255,255,0.14); left: 80px; top: 260px; transform: rotate(-18deg); border: 2px solid rgba(255,255,255,0.18); }
  .egg.two { width: 110px; height: 150px; left: 830px; top: 118px; transform: rotate(18deg); }
  .petal { width: 180px; height: 180px; background: rgba(255,255,255,0.08); right: -30px; bottom: 240px; }
  .petal.two { width: 340px; height: 340px; left: -120px; bottom: -100px; }
  .brand-pill { position:absolute; top:72px; left:72px; display:inline-flex; gap:14px; align-items:center; padding:14px 22px; border-radius:999px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.24); backdrop-filter: blur(16px); font-size: 26px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .brand-pill span.dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.92); display:inline-block; }
  .eyebrow { position:absolute; left:84px; top:180px; font-size:26px; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,0.86); }
  .headline { position:absolute; left:78px; right:110px; top:250px; font-family: Georgia, 'Iowan Old Style', serif; font-size: 108px; line-height: .92; font-weight: 700; text-wrap: balance; max-width: 8ch; }
  .support { position:absolute; left:84px; right:130px; top:735px; font-size: 42px; line-height: 1.28; color: rgba(255,255,255,0.90); max-width: 21ch; }
  .footer { position:absolute; left:78px; right:78px; bottom:92px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .cta { display:inline-flex; align-items:center; padding:26px 36px; border-radius:999px; background: rgba(255,255,255,0.92); color:#2e211d; font-size:32px; font-weight:800; box-shadow: 0 18px 44px rgba(0,0,0,0.14); max-width: 560px; }
  .signature { text-align:right; font-size:26px; line-height:1.35; color: rgba(255,255,255,0.82); }
  .signature strong { display:block; font-size:30px; color:#fff; }
</style>
</head>
<body>
  <div class="frame">
    <div class="photo"></div>
    <div class="wash"></div>
    <div class="egg"></div>
    <div class="egg two"></div>
    <div class="petal"></div>
    <div class="petal two"></div>
    <div class="brand-pill"><span class="dot"></span>Seasonal</div>
    <div class="eyebrow">Self-Care Sunday</div>
    <div class="headline">A soft spring<br>reset</div>
    <div class="support">Rest, reset, and let the season feel lighter on your skin.</div>
    <div class="footer">
      <div class="cta">Book your reset</div>
      <div class="signature"><strong>NCS Aesthetics</strong>Fresno, California</div>
    </div>
  </div>
</body>
</html>
