<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fresno SPF reapplication rules</title>
    <style>
      body {
        margin: 0;
        background: #d8d8d8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .frame {
        width: 1080px;
        height: 1350px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, #f5f7f2 0%, #dbe5dc 100%);
        color: #203126;
      }
      .orb {
        position: absolute;
        border-radius: 999px;
        background: rgba(255,255,255,0.24);
        filter: blur(2px);
      }
      .o1 { width: 380px; height: 380px; right: -88px; top: 62px; }
      .o2 { width: 250px; height: 250px; right: 120px; top: 490px; opacity: 0.75; }
      .o3 { width: 580px; height: 580px; left: -200px; bottom: -180px; opacity: 0.7; }
      .badge {
        position: absolute;
        top: 72px;
        left: 72px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        border-radius: 999px;
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(255,255,255,0.22);
        font-size: 28px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .pill {
        position: absolute;
        top: 72px;
        right: 72px;
        padding: 14px 24px;
        border-radius: 999px;
        background: rgba(255,255,255,0.42);
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 700;
      }
      .headline {
        position: absolute;
        left: 72px;
        right: 92px;
        top: 220px;
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-size: 106px;
        line-height: 0.92;
        letter-spacing: -0.04em;
        font-weight: 700;
      }
      .body {
        position: absolute;
        left: 80px;
        right: 120px;
        top: 690px;
        font-size: 42px;
        line-height: 1.24;
        color: rgba(32, 49, 38, 0.72);
      }
      .cta {
        position: absolute;
        left: 72px;
        bottom: 108px;
        padding: 28px 42px;
        border-radius: 999px;
        background: #203126;
        color: #f6fbf7;
        font-size: 34px;
        font-weight: 800;
      }
      .brand {
        position: absolute;
        right: 72px;
        bottom: 116px;
        font-size: 28px;
        color: rgba(32, 49, 38, 0.72);
      }
      .meta {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 44px;
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(32, 49, 38, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="frame" aria-label="Fresno SPF reapplication rules">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="badge">Fresno Skin Tips</div>
      <div class="pill">carousel</div>
      <div class="headline">Fresno SPF<br>rules</div>
      <div class="body">One application is not enough outdoors. Reapply every 2 hours and after sweating.</div>
      <div class="cta">Save this</div>
      <div class="brand">NCS Aesthetics</div>
      <div class="meta">
        <span>03</span>
        <span>Fresno skin education</span>
      </div>
    </div>
  </body>
</html>
